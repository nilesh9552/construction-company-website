<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Admin Login</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="login-container">
    <h2>Admin Login</h2>
    <p id="loginError" style="display:none;color:#b00020;">Invalid username or password.</p>
    <form method="post" action="/login">
      <label>Username<br><input name="username" required></label><br>
      <label>Password<br><input name="password" type="password" required></label><br>
      <button type="submit">Sign in</button>
    </form>
  </div>
  <script>
    if (new URLSearchParams(window.location.search).has('error')) {
      document.getElementById('loginError').style.display = 'block';
    }
  </script>
</body>
</html>
