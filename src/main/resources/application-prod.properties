spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:/var/data/constructiondb;MODE=MySQL;DB_CLOSE_DELAY=-1;AUTO_SERVER=FALSE}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.flyway.baseline-on-migrate=true
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=50MB
app.upload-dir=${APP_UPLOAD_DIR:/var/data/uploads}
app.s3.enabled=${APP_S3_ENABLED:false}
app.s3.bucket=${APP_S3_BUCKET:}
AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:}
AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:}
AWS_REGION=${AWS_REGION:us-east-1}
server.compression.enabled=true
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never